services:
  api:
      container_name: api-prod
      image: api-prod
      build: ./api
      ports:
        - 3000:3000
      environment:
        - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
        - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
        - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
        - AZURE_BLOB_SAS_TOKEN=${AZURE_BLOB_SAS_TOKEN}
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:3000/actuator/health"]
        interval: 10s
        timeout: 5s
        retries: 5
      entrypoint: ["java", "-jar", "app.jar", "--spring.profiles.active=staging"]

  frontend:
      container_name: frontend-prod
      image: frontend-prod
      build:
        context: ./frontend
      ports:
        - 5173:5173
      depends_on:
        api:
          condition: service_healthy

  reverse-proxy:
      container_name: reverse-proxy-prod
      image: reverse-proxy-prod
      build: ./reverse-proxy
      ports:
        - 80:80
      depends_on:
        api:
          condition: service_healthy
        frontend:
          condition: service_started