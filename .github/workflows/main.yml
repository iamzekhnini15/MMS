name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write
  actions: read
  contents: read

env:
  AZURE_WEBAPP_NAME: mms-staging-app
  AZURE_WEBAPP_RESOURCE_GROUP: mms-app

jobs:
  api_test:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('api/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run Unit & Integration Tests
        run: |
          cd api
          mvn clean verify -Dspring.profiles.active=test

      - name: Generate Coverage Report
        run: |
          cd api
          mvn jacoco:report

      - name: Upload API Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            api/target/site/
            api/target/surefire-reports/
            api/target/failsafe-reports/

  frontend_test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint, Test, and Build
        run: |
          cd frontend
          npm run lint
          npm run coverage
          npm run build

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-build
          path: frontend/dist/

  e2e_test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [api_test, frontend_test]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        run: docker --version

      - name: Build all images
        run: |
          echo "Building all Docker images..."
          docker compose build --no-cache

      - name: Start stack with docker-compose
        run: |
          echo "Starting application stack..."
          docker compose up --abort-on-container-exit --exit-code-from e2e --timeout 300

      - name: Show container status
        if: always()
        run: docker compose ps -a

      - name: Show logs if failed
        if: failure()
        run: |
          echo "=== Database logs ==="
          docker compose logs db
          echo "=== API logs ==="
          docker compose logs api
          echo "=== Frontend logs ==="
          docker compose logs frontend
          echo "=== E2E logs ==="
          docker compose logs e2e

      - name: Copy E2E reports
        if: always()
        run: |
          CONTAINER_ID=$(docker ps -aqf "name=e2e-prod")
          if [ ! -z "$CONTAINER_ID" ]; then
            docker cp $CONTAINER_ID:/app/playwright-report ./e2e/playwright-report || true
            docker cp $CONTAINER_ID:/app/test-results ./e2e/test-results || true
          fi

      - name: Shutdown stack
        if: always()
        run: docker compose down --volumes

      - name: Upload E2E Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            e2e/playwright-report/
            e2e/test-results/

  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [api_test, frontend_test]

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif

      # Optionnel : rapport sécurité dans GitHub Security tab
      # - name: Upload Security Results
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: trivy-results.sarif

  build_and_push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [api_test, frontend_test]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/frontend-prod:latest -f frontend/Dockerfile frontend
          docker tag ghcr.io/${{ secrets.GHCR_USERNAME }}/frontend-prod:latest ghcr.io/${{ secrets.GHCR_USERNAME }}/frontend-prod:${{ github.run_number }}
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/frontend-prod:latest
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/frontend-prod:${{ github.run_number }}

      - name: Build and push api image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/api-prod:latest -f api/Dockerfile api
          docker tag ghcr.io/${{ secrets.GHCR_USERNAME }}/api-prod:latest ghcr.io/${{ secrets.GHCR_USERNAME }}/api-prod:${{ github.run_number }}
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/api-prod:latest
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/api-prod:${{ github.run_number }}

      - name: Build and push reverse proxy image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/reverse-proxy-prod:latest -f reverse-proxy/Dockerfile reverse-proxy
          docker tag ghcr.io/${{ secrets.GHCR_USERNAME }}/reverse-proxy-prod:latest ghcr.io/${{ secrets.GHCR_USERNAME }}/reverse-proxy-prod:${{ github.run_number }}
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/reverse-proxy-prod:latest
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/reverse-proxy-prod:${{ github.run_number }}

  deploy:
    name: Deploy to Staging on Azure
    runs-on: ubuntu-latest
    needs: [build_and_push, e2e_test, security_scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Stop Azure Web App
        run: |
          az webapp stop --name $AZURE_WEBAPP_NAME --resource-group $AZURE_WEBAPP_RESOURCE_GROUP

      - name: Deploy Docker Compose config to Azure Web App
        run: |
          az webapp config container set \
            --name $AZURE_WEBAPP_NAME \
            --resource-group $AZURE_WEBAPP_RESOURCE_GROUP \
            --multicontainer-config-type compose \
            --multicontainer-config-file docker-compose.deploy.yml \
            --container-registry-user ${{ secrets.GHCR_USERNAME }} \
            --container-registry-password ${{ secrets.GHCR_TOKEN }}

      - name: Start Azure Web App
        run: |
          az webapp start --name $AZURE_WEBAPP_NAME --resource-group $AZURE_WEBAPP_RESOURCE_GROUP
