name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  api_test:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Unit & Integration Tests
        run: |
          cd api
          mvn clean verify -Dspring.profiles.active=test

      - name: Generate Coverage Report
        run: |
          cd api
          mvn jacoco:report

      - name: Upload API Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            api/target/site/
            api/target/surefire-reports/
            api/target/failsafe-reports/

  frontend_test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint, Test, and Build
        run: |
          cd frontend
          npm run lint
          npm run coverage
          npm run build

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-build
          path: frontend/dist/

  e2e_test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [api_test, frontend_test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        run: docker --version

      - name: Start stack with docker-compose
        run: docker compose up --build --exit-code-from e2e

      - name: Show logs if failed
        if: failure()
        run: docker compose logs

      - name: Copy E2E reports
        if: always()
        run: |
          CONTAINER_ID=$(docker ps -aqf "name=e2e-prod")
          docker cp $CONTAINER_ID:/app/playwright-report ./e2e/playwright-report || true
          docker cp $CONTAINER_ID:/app/test-results ./e2e/test-results || true

      - name: Shutdown stack
        if: always()
        run: docker compose down

      - name: Upload E2E Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            e2e/playwright-report/
            e2e/test-results/

  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [api_test, frontend_test]

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      # - name: Upload Security Results
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [api_test, frontend_test, e2e_test, security_scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download API Reports
        uses: actions/download-artifact@v4
        with:
          name: api-test-reports
          path: ./api-reports

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-build

      - name: Download E2E Reports
        uses: actions/download-artifact@v4
        with:
          name: e2e-reports
          path: ./e2e-reports

      - name: Simulate Deployment
        run: |
          echo "🚀 Deploying to staging..."
          echo "✅ All tests passed"
          echo "✅ Security scan OK"
          echo "🎉 Deployment completed!"
