# Test configuration for Docker environment
spring.application.name=demo-test

# Docker database configuration
spring.datasource.url=jdbc:postgresql://db-test:5432/mms
spring.datasource.username=postgres
spring.datasource.password=HayounZ2002/
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable web security for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# File upload configuration for tests
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
file.upload.dir=test-uploads

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Logging configuration for tests
logging.level.be.vinci.ipl.cae.demo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Disable banner for cleaner test output
spring.main.banner-mode=off

# Connection pool settings for better stability
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
