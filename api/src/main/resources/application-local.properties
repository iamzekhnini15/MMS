spring.application.name=demo

server.port=3000

# Base de données locale H2 en mémoire pour dev
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Azure Blob Storage (optionnel pour dev local)
azure.blob.service-endpoint=https://mmsfilestorage01.blob.core.windows.net/
azure.blob.container-name=dev
azure.blob.sas-token=${AZURE_BLOB_SAS_TOKEN:dummy-token}

# Configuration upload de fichiers
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=uploads
