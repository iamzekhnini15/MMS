# Configuration pour Azure App Service
server.port=${PORT:8080}

# Base de données Azure PostgreSQL
spring.datasource.url=${AZURE_DATABASE_URL:jdbc:postgresql://localhost:5432/mms}
spring.datasource.username=${AZURE_DATABASE_USERNAME:mmsadmin@mms-database-server}
spring.datasource.password=${AZURE_DATABASE_PASSWORD:password}

# Spécification explicite du dialecte PostgreSQL pour Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mise à jour automatique du schéma (utile pour prod, à contrôler)
spring.jpa.hibernate.ddl-auto=update

# Logs SQL désactivés en prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuration CORS pour Azure Static Web Apps
cors.allowed-origins=${AZURE_FRONTEND_URL:https://jolly-coast-079730803.2.azurestaticapps.net}

# Configuration de logging pour Azure
logging.level.root=INFO
logging.level.be.vinci.ipl.cae.demo=INFO
