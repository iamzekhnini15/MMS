spring.application.name=demo

server.port=3000

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.generate-ddl=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


azure.blob.service-endpoint=https://mmsfilestorage01.blob.core.windows.net/
azure.blob.sas-token=${AZURE_BLOB_SAS_TOKEN:}
azure.blob.container-name=staging

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----------------- Mail configuration (SMTP) -----------------
# These values prefer environment variables. For local development you can
# populate a .env file at the repo root (project uses spring-dotenv).

# SMTP host and port (defaults to Gmail SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.transport.protocol=smtp

# Credentials (recommended: use an app password for Gmail)
spring.mail.username=${SMTP_USERNAME:iamzekhnini@gmail.com}
spring.mail.password=${SMTP_PASSWORD}

# TLS / auth settings
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}

spring.mail.default-encoding=UTF-8

# From address used by the application
app.mail.from=${MAIL_FROM:iamzekhnini@gmail.com}

# Enable email notifications
app.mail.enabled=true

# Note: do NOT commit real credentials. Use environment variables or a secrets manager in production.