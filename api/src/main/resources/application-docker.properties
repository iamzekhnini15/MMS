spring.application.name=mms-api

# Configuration serveur
server.port=3000
server.servlet.context-path=/api

# Configuration base de données
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/mms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:HayounZ2002/}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Configuration des scripts SQL - désactivé temporairement
spring.sql.init.mode=never

# Configuration upload de fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=${FILE_UPLOAD_DIR:/app/uploads}

# Configuration logs
logging.level.be.vinci.ipl.cae.demos=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Configuration CORS
cors.allowed-origins=http://localhost,http://localhost:80,http://frontend
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Configuration actuator pour health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
logging.level.be.vinci.ipl.cae.demo=DEBUG

# Configuration de santé (Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Initialisation des données
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:insert.sql,classpath:test-data.sql,classpath:create-admin.sql
