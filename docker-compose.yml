services:
  frontend:
    container_name: frontend-prod
    image: frontend-prod
    build:
      context: ./frontend
    ports:
      - 5173:80
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    container_name: api-prod
    image: api-prod
    build: ./api
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: mms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HayounZ2002/
      AZURE_BLOB_SAS_TOKEN: "dummy_token_for_testing"
    entrypoint: ["/wait-for-postgres.sh", "db-test", "java", "-jar", "app.jar", "--spring.profiles.active=test"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    image: postgres:latest
    container_name: db-test
    environment:
      POSTGRES_DB: mms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HayounZ2002/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  reverse-proxy:
    container_name: reverse-proxy-prod
    image: nginx:alpine
    ports:
      - 80:80
    depends_on:
      - frontend
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

  e2e:
    container_name: e2e-prod
    image: e2e-prod
    build: ./e2e
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy