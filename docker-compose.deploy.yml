version: '3.8'

services:
  api:
    image: ghcr.io/iamzekhnini15/api-prod:latest
    container_name: api-prod
    ports:
      - "3000:3000"  # Expose port for debugging on Azure
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AZURE_BLOB_SAS_TOKEN: ${AZURE_BLOB_SAS_TOKEN}
    entrypoint: ["java", "-jar", "app.jar", "--spring.profiles.active=staging"]

  frontend:
    image: ghcr.io/iamzekhnini15/frontend-prod:latest
    container_name: frontend-prod
    ports:
      - "8080:80"  # Expose on different port
    depends_on:
      - api

  reverse-proxy:
    image: ghcr.io/iamzekhnini15/reverse-proxy-prod:latest
    container_name: reverse-proxy-prod
    ports:
      - "80:80"  # Public port
    depends_on:
      - frontend
