version: '3.8'

services:
  frontend:
    image: ghcr.io/iamzekhnini15/frontend-prod:latest
    container_name: frontend-prod
    expose:
      - "80"  # accessible en interne uniquement (via reverse-proxy)

  api:
    image: ghcr.io/iamzekhnini15/api-prod:latest
    container_name: api-prod
    expose:
      - "3000"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AZURE_BLOB_SAS_TOKEN: ${AZURE_BLOB_SAS_TOKEN}
    entrypoint: ["java", "-jar", "app.jar", "--spring.profiles.active=staging"]

  reverse-proxy:
    image: ghcr.io/iamzekhnini15/reverse-proxy-prod:latest
    container_name: reverse-proxy-prod
    ports:
      - "80:80"  # c'est ce conteneur que Azure va exposer publiquement
    depends_on:
      - api
